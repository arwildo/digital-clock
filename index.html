<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jam digital untuk workout dan latihan olahraga. Timer digital yang membantu mengetahui kapan set berikutnya dimulai. Alat bantu latihan dan interval training.">
    <meta name="keywords" content="jam digital, workout timer, interval timer, fitness clock, gym timer, exercise clock, latihan olahraga">
    <title>Digital Clock Online - Time Antara Set Olaharga</title>
    <link rel="canonical" href="https://www.example.com/workout-timer" />
    <link rel="icon" type="image/x-icon" href="assets/logo.ico">
</head>
<body>
    <div class="digital-clock">
        <div id="clock"></div>
    </div>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
        }

        .digital-clock {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #clock {
            font-family: "DS-Digital", "Segment7", monospace;
            font-size: 300px;
            background: #fff;
            padding: 20px 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            letter-spacing: 5px;
        }

        @font-face {
            font-family: 'DS-Digital';
            src: url('assets/DS-DIGIT.TTF') format('truetype');
        }
    </style>

    <script>
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            hours = hours < 10 ? "0" + hours : hours;
            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;

            const timeString = `<span style="color: #666666">${hours}</span><span style="color: #888888">:</span><span style="color: #444444">${minutes}</span><span style="color: #888888">:</span><span style="color: #111111">${seconds}</span>`;
            document.getElementById('clock').innerHTML = timeString;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
